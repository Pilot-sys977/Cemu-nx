name: Switch environment diagnostics
# Read-only inspection of the Switch build container. Builds nothing.
on:
  push:
    branches:
      - mario-party-10-fix
    paths:
      - .github/workflows/switch-env-diagnostics.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/autorunhq/switch-dev:latest
    steps:
      - name: Inspect
        shell: bash
        run: |
          set +e +o pipefail
          sed -n '1,80p' /opt/devkitpro/libnx/include/switch/nacp.h
          grep -n 'NacpStruct\|langentry\|NacpLanguageEntry' /opt/devkitpro/libnx/include/switch/nacp.h
          ls -la /opt/devkitpro/libnx/include/switch/nacp.h
