name: Switch environment diagnostics
# Read-only inspection of the Switch build container. Builds nothing.
on:
  workflow_dispatch:
  push:
    branches:
      - mario-party-10-fix
    paths:
      - .github/workflows/switch-env-diagnostics.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/autorunhq/switch-dev:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Inspect
        shell: bash
        run: |
          set +e +o pipefail
          python3 dist/switch/deps/check_mesa_link_closure.py
          echo "exit=$?"
          P=/opt/devkitpro/portlibs/switch
          NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          echo "=== which members of libvulkan.a mention elf/cubin ==="
          $NM -A $P/lib/libvulkan.a 2>/dev/null | grep -iE 'elf|cubin' | head -40
          ls $P/include | head -100
          ls $P/share/mesa-switch; cat $P/share/mesa-switch/* 2>/dev/null | head -20
