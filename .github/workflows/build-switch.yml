
name: Build Cemu-nx Switch Core

on:
  workflow_dispatch:
  push:
    branches:
      - mario-party-10-fix
    paths:
      - .github/workflows/build-switch.yml

jobs:
  build-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/autorunhq/switch-dev:latest

    env:
      DEVKITPRO: /opt/devkitpro
      SWITCH_MESA_SDK_ROOT: /opt/devkitpro/portlibs/switch
      BUILD_JOBS: "2"
      CEMU_SWITCH_PGO: "OFF"

    steps:
      - name: Check out modified Cemu-nx
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify HOME mapping
        shell: bash
        run: |
          grep -n 'kButtonId_Home, "Home", "R"' \
            src/platform/switch/SwitchInput.cpp

      
      - name: Build Switch emulator core
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH"
          bash dist/switch/build.sh

      - name: Upload compiled core
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modified-cemu-core
          path: bin/cemu_core.nro
          if-no-files-found: error
